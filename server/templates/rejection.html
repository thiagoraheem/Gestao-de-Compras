<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background-color: #fee2e2; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    .content { margin-bottom: 20px; }
    .reason { background-color: #f8f9fa; padding: 15px; border-left: 4px solid #dc2626; margin: 15px 0; }
    .footer { font-size: 12px; color: #666; text-align: center; border-top: 1px solid #eee; padding-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2 style="color: #dc2626; margin: 0;">Solicitação Rejeitada</h2>
      <p style="margin: 5px 0 0 0;">Número: <strong>{{requestNumber}}</strong></p>
    </div>
    <div class="content">
      <p>Olá {{userName}},</p>
      <p>{{introText}}</p>
      
      <div class="reason">
        <strong>Motivo da rejeição:</strong><br>
        {{rejectionReason}}
      </div>

      <p>
        <a href="{{requestUrl}}" style="background-color: #6b7280; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block;">
          Ver Detalhes
        </a>
      </p>
    </div>
    <div class="footer">
      <p>Este é um e-mail automático do Sistema de Gestão de Compras.</p>
    </div>
  </div>
</body>
</html>
